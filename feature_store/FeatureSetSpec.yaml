    type: string
  - name: review_year
    type: integer

  # --- Review Length Features ---
  - name: review_length_words
    type: integer
  - name: review_length_chars
    type: integer

  # --- Sentiment Features ---
  - name: sentiment_pos
    type: double
  - name: sentiment_neg
    type: double
  - name: sentiment_neu
    type: double
  - name: sentiment_compound
    type: double