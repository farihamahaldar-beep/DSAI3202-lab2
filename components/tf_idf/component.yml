$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: tfidf_features
display_name: TF-IDF Feature Extraction
type: command
inputs:
  train_data:
    type: uri_folder
  val_data:
    type: uri_folder
  test_data:
    type: uri_folder
  deploy_data:
    type: uri_folder
  text_column:
    type: string
    default: "reviewText"
  max_features:
    type: integer
    default: 100
  ngram_range:
    type: string
    default: "1,2"
outputs:
  train_out:
    type: uri_folder
  val_out:
    type: uri_folder
  test_out:
    type: uri_folder
  deploy_out:
    type: uri_folder
  vectorizer_output:
    type: uri_folder
code: .
command: >
  python tf_idf.py
  --train_data ${{inputs.train_data}}
  --val_data ${{inputs.val_data}}
  --test_data ${{inputs.test_data}}
  --deploy_data ${{inputs.deploy_data}}
  --train_out ${{outputs.train_out}}
  --val_out ${{outputs.val_out}}
  --test_out ${{outputs.test_out}}
  --deploy_out ${{outputs.deploy_out}}
  --vectorizer_output ${{outputs.vectorizer_output}}
  --text_column ${{inputs.text_column}}
  --max_features ${{inputs.max_features}}
  --ngram_range ${{inputs.ngram_range}}
environment: azureml:AzureML-sklearn-1.1-ubuntu20.04-py38-cpu@latest