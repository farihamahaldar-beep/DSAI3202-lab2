$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: split_dataset
display_name: Train/Validation Split
description: >
  Merges feature matrix with RUL labels, then performs a stratified
  80/20 train/validation split. Stratification bins RUL values to ensure
  even distribution of engine health states across both splits.
version: "1.0"
type: command

inputs:
  input_features:
    type: uri_folder
    description: Parquet folder — GA-selected train feature matrix
  input_labels:
    type: uri_folder
    description: Parquet folder — aligned RUL labels
  val_size:
    type: number
    default: 0.2
    description: Fraction of data held out for validation
  random_seed:
    type: integer
    default: 42
  stratify_bins:
    type: integer
    default: 10
    description: Number of RUL bins for stratified split (0 to disable)

outputs:
  output_train:
    type: uri_folder
    description: Training split — features + target_RUL column (parquet)
  output_val:
    type: uri_folder
    description: Validation split — features + target_RUL column (parquet)

environment:
  conda_file: ./conda.yml
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04

command: >-
  python split_dataset.py
  --input_features ${{inputs.input_features}}
  --input_labels ${{inputs.input_labels}}
  --output_train ${{outputs.output_train}}
  --output_val ${{outputs.output_val}}
  --val_size ${{inputs.val_size}}
  --random_seed ${{inputs.random_seed}}
  --stratify_bins ${{inputs.stratify_bins}}

code: .