$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: extract_features
display_name: Extract Time-Series Features
description: Extract features using tsfresh with EfficientFCParameters from preprocessed turbofan data
type: command
version: 1

inputs:
  train_data:
    type: uri_folder
    description: Preprocessed training data folder
  test_data:
    type: uri_folder
    description: Preprocessed test data folder

outputs:
  output_dir:
    type: uri_folder
    description: Output folder containing extracted features and targets

command: >-
  python extract_features.py
  --train_data ${{inputs.train_data}}
  --test_data ${{inputs.test_data}}
  --output_dir ${{outputs.output_dir}}

code: .
environment: azureml:AzureML-sklearn-1.1-ubuntu20.04-py38-cpu@latest