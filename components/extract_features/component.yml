$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: extract_features
display_name: tsfresh Feature Extraction
description: >
  Extracts time-series features from turbofan engine sensor data using
  tsfresh EfficientFCParameters with a rolling-window strategy.
  Produces per-engine-per-cycle feature vectors aligned with RUL labels.
version: "3.0"
type: command

inputs:
  input_train:
    type: uri_folder
    description: Parquet folder — train_tsfresh_ready (engine_id, cycle, sensors)
  input_test:
    type: uri_folder
    description: Parquet folder — test_tsfresh_ready (engine_id, cycle, sensors)
  input_labels:
    type: uri_folder
    description: Parquet folder — train_rul_labels (engine_id, cycle, target_RUL)
  n_jobs:
    type: integer
    default: 4
    description: Parallel workers for tsfresh extraction
  window_size:
    type: integer
    default: 30
    description: Rolling window size (number of cycles per time-series segment)

outputs:
  output_train_features:
    type: uri_folder
    description: Extracted train feature matrix (parquet)
  output_test_features:
    type: uri_folder
    description: Extracted test feature matrix (parquet)
  output_labels:
    type: uri_folder
    description: Aligned RUL labels for train rows (parquet)

environment:
  conda_file: ./conda.yml
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04

command: >-
  python extract_features.py
  --input_train ${{inputs.input_train}}
  --input_test ${{inputs.input_test}}
  --input_labels ${{inputs.input_labels}}
  --output_train_features ${{outputs.output_train_features}}
  --output_test_features ${{outputs.output_test_features}}
  --output_labels ${{outputs.output_labels}}
  --n_jobs ${{inputs.n_jobs}}
  --window_size ${{inputs.window_size}}

code: .
